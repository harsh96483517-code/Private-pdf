name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the Android project folder
        id: proj
        run: |
          echo "Files in repo:"
          find . -maxdepth 3 -not -path './.git/*' -not -path './.github/*' | sort | head -80
          FILE=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle.kts not found. Upload the whole project (app folder, build.gradle.kts, settings.gradle.kts, gradle.properties) to the repo."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          if [ ! -d "$DIR/app" ]; then
            echo "::error::The 'app' folder is missing next to settings.gradle.kts ($DIR)."
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace --console=plain --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassPDF-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Build release APK (optimized, debug-signed)
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: gradle assembleRelease --stacktrace --console=plain --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassPDF-release-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
